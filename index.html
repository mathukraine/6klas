app.innerHTML=`<div class="glass q" style="margin-top:40px"><div class="land">${st==3?'🏆':'🚀'}</div><h1 class="u" style="font-size:26px;margin:10px 0">${st==3?'Неймовірно!':st==2?'Круто!':'Гарний старт!'}</h1><div class="st" style="font-size:56px;margin:10px 0">${[0,1,2].map(i=>`<span class="pst" style="animation-delay:${.9+i*.35}s;${i<st?'':'filter:grayscale(1);opacity:.35'}">⭐</span>`).join('')}</div><p style="font-size:19px">З першої спроби: <b>${r.first}</b> з ${r.qs.length}<br>Зароблено: <b>+${r.xp} XP</b> 🌟</p><div class="acts"><button class="btn" onclick="start(${r.i},'${r.m}',${r.ex||0})">Ще раз 🔁</button><button class="btn g" onclick="home()">До карти 🗺️</button></div></div>`}
$('fx').innerHTML=Array.from({length:18},()=>`<i style="--l:${Math.random()*100}%;--s:${20+Math.random()*26}px;--d:${16+Math.random()*16}s;animation-delay:-${Math.random()*30}s">${pick(['➕','➖','✖️','➗','½','¾','%','π','⭐','🔢','🧮'])}</i>`).join('');
home();
</script></body></html>
